name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build binary
        run: |
          set -e
          mkdir -p release/
          docker build -t podman-compose-bin .
          # The Dockerfile bakes the binary into /result inside the image.
          # docker build has no volume flag (that is podman-only), so create a
          # container from the image and copy the file out of it instead.
          docker create --name podman-compose-bin podman-compose-bin
          docker cp podman-compose-bin:/result/podman-compose release/podman-compose-linux-x86
          docker rm podman-compose-bin

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: ./release/podman-compose-linux-x86
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
